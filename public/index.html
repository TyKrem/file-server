<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>文件服务 · file.tykrem.top</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b7fc4' d='M3 6h6l2 2h10v12H3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📁</span>
      <span class="brand-name">文件服务</span>
    </div>
    <div class="top-actions">
      <button id="admin-toggle" class="btn ghost" type="button">管理模式</button>
    </div>
  </header>

  <div id="admin-panel" class="admin-panel hidden">
    <form id="code-form" class="code-form" autocomplete="off">
      <input id="admin-code" type="password" placeholder="输入超级码" maxlength="128">
      <button class="btn primary" type="submit">解锁</button>
    </form>
    <div id="admin-tools" class="admin-tools hidden">
      <button id="upload-btn" class="btn primary" type="button">上传文件</button>
      <button id="mkdir-btn" class="btn" type="button">新建文件夹</button>
      <button id="lock-btn" class="btn ghost" type="button">锁定</button>
      <span class="admin-tip">游客只能查看和下载；管理模式可上传 / 删除 / 重命名 / 移动 / 复制</span>
    </div>
  </div>
  <input id="file-input" type="file" multiple hidden>

  <main class="container">
    <div class="usage-bar">
      <div class="usage-head"><span id="usage-text">使用 0 B / 20 GB</span><span id="usage-pct">0%</span></div>
      <div class="usage-track"><div class="usage-fill" id="usage-fill"></div></div>
    </div>

    <div class="crumb-bar">
      <button id="root-btn" class="crumb" type="button">根目录</button>
      <span id="crumb-more" class="crumb-text"></span>
      <button id="refresh-btn" class="btn small ghost" type="button">刷新</button>
    </div>

    <section id="file-list" class="file-list">
      <div class="empty">加载中…</div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
