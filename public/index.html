<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0b7fc4">
  <title>文件服务 · file.tykrem.top</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b7fc4' d='M3 6h6l2 2h10v12H3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css?v=20260921">
</head>
<body>
  <header class="appbar">
    <button id="brand" class="brand" type="button">
      <span class="brand-icon">📁</span>
      <span class="brand-name">文件服务</span>
    </button>
    <div class="appbar-actions">
      <button id="refresh-btn" class="icon-btn" type="button" title="刷新列表" aria-label="刷新列表">⟳</button>
      <button id="lock-btn" class="btn admin-btn hidden" type="button" title="退出并清除本机解锁状态">
        <span class="admin-icon">🔓</span>
        <span class="admin-label">锁定</span>
      </button>
    </div>
  </header>

  <section id="gate" class="gate hidden">
    <form id="gate-form" class="gate-card" autocomplete="off">
      <div class="gate-icon">🔒</div>
      <h2 class="gate-title">需要超级码</h2>
      <p class="gate-sub">整站都按超级码控制，输入一次保持 12 小时</p>
      <input id="gate-input" class="gate-input" type="password" placeholder="输入超级码" aria-label="超级码">
      <div id="gate-hint" class="gate-hint hidden"></div>
      <button id="gate-submit" class="btn primary gate-submit" type="submit">解锁</button>
    </form>
  </section>

  <div class="wrap" id="wrap">
    <nav class="toolbar">
      <button id="back-btn" class="icon-btn hidden" type="button" title="返回上级" aria-label="返回上级">‹</button>
      <div class="crumbs" id="crumbs"></div>
      <div id="toolbar-actions" class="toolbar-actions admin-only hidden">
        <button id="mkdir-btn" class="btn" type="button">
          <span class="btn-long">新建文件夹</span><span class="btn-short">新建</span>
        </button>
        <button id="upload-btn" class="btn primary" type="button">上传</button>
      </div>
    </nav>

    <div class="usage">
      <div class="usage-track"><div class="usage-fill" id="usage-fill"></div></div>
      <span class="usage-text" id="usage-text">正在统计用量…</span>
    </div>

    <section id="list" class="list">
      <div class="empty">加载中…</div>
    </section>
  </div>

  <div id="drop-hint" class="drop-hint hidden">
    <div class="drop-hint-box">松开即可上传到当前目录</div>
  </div>

  <div id="upload-box" class="upload-box hidden">
    <div class="upload-text" id="upload-text">上传中…</div>
    <div class="upload-track"><div class="upload-fill" id="upload-fill"></div></div>
  </div>

  <input id="file-input" type="file" multiple hidden>
  <div id="toast" class="toast hidden"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-mask" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-foot" class="modal-foot"></div>
    </div>
  </div>

  <script src="/js/app.js?v=20260921"></script>
</body>
</html>
