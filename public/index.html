<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0b63ce">
  <script src="/theme.js?v=20261003-theme"></script>
<title>文件服务 · file.tykrem.top</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b63ce' d='M3 6h6l2 2h10v12H3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css?v=20261003-theme">
<link rel="stylesheet" href="/theme.css?v=20261003-theme">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol>
    <symbol id="icon-media" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4Z"/></symbol>
    <symbol id="icon-archive" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v13h14V8M10 12h4"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-3l2 2M4 17l2 2a8 8 0 0 0 13-3"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </svg>
  <header class="appbar">
    <button id="brand" class="brand" type="button" title="返回全部文件">
      <span class="brand-icon"><svg class="icon"><use href="#icon-folder"/></svg></span>
      <span class="brand-name">文件服务</span>
    </button>
    <div class="appbar-actions">
      <a id="ipv4-entry" class="btn appbar-home" href="https://file4.tykrem.top/" title="使用 IPv4 访问文件服务">IPv4 入口</a>
      <a class="btn appbar-home" href="https://tykrem.top/" aria-label="返回监控页">监控页</a>
      <button id="lock-btn" class="btn admin-btn hidden" type="button" title="退出所有站点">
        退出
      </button>
    </div>
  </header>

  <section id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-icon"><svg class="icon"><use href="#icon-lock"/></svg></div>
      <h2 class="gate-title">需要登录</h2>
      <p class="gate-sub">登录后即可访问你的文件<br>支持只读与管理权限，有效期 7 天</p>
      <div id="gate-hint" class="gate-hint hidden"></div>
      <a id="login-link" class="btn primary gate-submit" href="https://tykrem.top/auth/">登录后返回文件站</a>
    </div>
  </section>

  <main class="wrap hidden" id="wrap">
    <section class="workspace-heading">
      <div>
        <div class="heading-label">文件空间 <span id="role-badge" class="role-badge"></span></div>
        <h1 id="folder-title">全部文件</h1>
        <p id="folder-summary" class="folder-summary" aria-live="polite">正在读取文件…</p>
      </div>
      <div id="toolbar-actions" class="toolbar-actions admin-only hidden">
        <button id="mkdir-btn" class="btn" type="button">
          <svg class="icon"><use href="#icon-plus"/></svg>
          <span class="btn-long">新建文件夹</span><span class="btn-short">新建</span>
        </button>
        <button id="upload-btn" class="btn primary" type="button"><svg class="icon"><use href="#icon-upload"/></svg>上传文件</button>
      </div>
    </section>
    <section class="file-panel" aria-label="文件列表">
      <div class="toolbar">
        <nav class="path-nav" aria-label="当前目录">
          <button id="back-btn" class="icon-btn hidden" type="button" title="返回上级" aria-label="返回上级"><svg class="icon"><use href="#icon-back"/></svg></button>
          <div class="crumbs" id="crumbs"></div>
        </nav>
        <div class="list-controls">
          <div class="search-box">
            <svg class="icon"><use href="#icon-search"/></svg>
            <input id="search-input" type="search" placeholder="搜索当前目录" aria-label="搜索当前目录" autocomplete="off">
            <button id="search-clear" class="search-clear hidden" type="button" aria-label="清空搜索"><svg class="icon"><use href="#icon-close"/></svg></button>
          </div>
          <select id="sort-select" aria-label="文件排序">
            <option value="name">名称排序</option>
            <option value="newest">最近修改</option>
            <option value="size">文件大小</option>
          </select>
          <button id="refresh-btn" class="icon-btn" type="button" title="刷新列表" aria-label="刷新列表"><svg class="icon"><use href="#icon-refresh"/></svg></button>
        </div>
      </div>
      <div class="list-heading" aria-hidden="true"><span>名称</span><span>大小</span><span>修改时间</span><span>操作</span></div>
      <section id="list" class="list" aria-label="当前目录内容" aria-busy="true">
        <div class="empty">加载中…</div>
      </section>
      <footer class="panel-footer">
        <span id="list-count">—</span>
        <div class="usage">
          <span class="usage-text" id="usage-text">正在统计用量…</span>
          <div class="usage-track"><div class="usage-fill" id="usage-fill"></div></div>
        </div>
      </footer>
    </section>
  </main>

  <div id="drop-hint" class="drop-hint hidden">
    <div class="drop-hint-box">松开即可上传到当前目录</div>
  </div>

  <div id="upload-box" class="upload-box hidden" role="status">
    <div class="upload-text" id="upload-text">上传中…</div>
    <div class="upload-track"><div class="upload-fill" id="upload-fill"></div></div>
  </div>

  <input id="file-input" type="file" multiple hidden>
  <div id="toast" class="toast hidden" role="status"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-mask" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-foot" class="modal-foot"></div>
    </div>
  </div>

  <script src="/js/app.js?v=20261003"></script>
</body>
</html>
